services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kirwin
      POSTGRES_PASSWORD: kirwin
      POSTGRES_DB: kirwin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kirwin
      POSTGRES_PASSWORD: kirwin
      POSTGRES_DB: kirwin_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  postgres_test_data:
